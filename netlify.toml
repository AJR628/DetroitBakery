[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "https://www.detroitbakery.com/*"
  to = "https://detroitbakery.com/:splat"
  status = 301
  force = true

# Google auto-discovers /sitemap.xml by convention, and it is the path most
# commonly pasted into Search Console. Astro emits the index as
# /sitemap-index.xml, so serve it at the conventional path too.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
